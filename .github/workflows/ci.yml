name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  environment-yml:
    # Mirrors `conda env create --file environment.yml` from the README so the
    # full pinned qiskit/pennylane stack (not just src/qfm's own dependencies)
    # is verified installable, catching cross-package version conflicts that
    # `pip install -e ".[dev]"` above doesn't exercise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: qfm-env

      - name: Run tests in the conda environment
        shell: bash -l {0}
        run: pytest tests/ -v
