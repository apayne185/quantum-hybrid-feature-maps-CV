[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qfm"
version = "0.1.0"
description = "Quantum feature maps for hybrid classical-quantum preprocessing"
requires-python = ">=3.10"
dependencies = [
    "pennylane",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
demo = [
    "streamlit",
    "pandas",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]
